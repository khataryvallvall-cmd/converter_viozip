workflows:
  android-webview:
    name: Converter Vio - Android WebView
    max_build_duration: 30
    environment:
      vars:
        PACKAGE_NAME: "com.khataryvallvall.convertervio"
      groups:
        - signing
    scripts:
      - name: Set execute permission for gradlew
        script: |
          chmod +x ./gradlew
      - name: Decode signing keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
          echo "CM_KEYSTORE_PATH=/tmp/keystore.jks" >> $CM_ENV
      - name: Build signed release bundle and APK
        script: |
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/apk/release/*.apk
