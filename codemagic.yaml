workflows:
  android-webview:
    name: Converter Vio - Android WebView
    max_build_duration: 30
    environment:
      vars:
        PACKAGE_NAME: "com.khataryvallvall.convertervio"
    scripts:
      - name: Set execute permission for gradlew
        script: |
          chmod +x ./gradlew
      - name: Build debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
