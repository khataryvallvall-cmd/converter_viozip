name: Extract Project Zip

on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip any zip files in the repo root
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "Extracting: $f"
            unzip -o "$f"
          done

      - name: Flatten nested top-level folder if present
        run: |
          if [ -d "converter-vio-android" ]; then
            cp -r converter-vio-android/. .
            rm -rf converter-vio-android
          fi
          rm -f *.zip

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-extract project zip"
          git push
